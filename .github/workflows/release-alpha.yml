# Release alpha/beta — NSIS installer + SHA256SUMS as a GitHub pre-release.
#
# Trigger: push a tag matching `v*-alpha*` or `v*-beta*` (e.g. `v0.4.0-beta`),
# or manual `workflow_dispatch` for a build-only dry-run (publish step is
# tag-only).
# The existing `v0.1.0-alpha` GitHub pre-release stays frozen; this workflow
# only ever creates/updates the pushed tag, never `main` history.
#
# Design notes (see `docs/release/README.md`, ADR-0029/0030):
# - Offline NSIS bundle only (`tauri.conf.json`: `targets: ["nsis"]`,
#   `webviewInstallMode: offlineInstaller`). Unsigned: SmartScreen
#   "unknown publisher" is expected until a signing certificate exists.
# - No `tauri-action`: it defaults to updater JSON, but auto-update is OFF
#   by design — build with `cargo tauri` directly instead.
# - Full gates run first on the tag so a red tree never ships.
# - SBOM/licenses/provenance stay local (SBOM embeds absolute paths and is
#   never committed); the workflow records the installer SHA-256 and the
#   `tauri-cli` version in the release body instead.
# - PresentMon is never bundled or downloaded (ADR-0028, user-supplied only).

name: Release alpha

on:
  push:
    tags:
      - "v*-alpha*"
      - "v*-beta*"
  # Manual dry-run: gates + NSIS build + SHA256SUMS run without publishing.
  # The publish step below is tag-only, so dispatch runs never create a release.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build + publish alpha pre-release
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust 1.99.0
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Gates (same order as local-gates.md)
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo test --workspace --all-features --locked

      - name: Install gate tools
        run: |
          cargo install cargo-deny --locked --version 0.20.2
          cargo install cargo-audit --locked --version 0.22.2

      - name: Dependency policy + audit
        run: |
          cargo deny check
          cargo audit

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - name: Schemas, docs, links
        run: |
          pip install jsonschema
          python tools/validate_schemas.py
          python tools/check_docs.py
          python -m unittest discover -s tools
          python tools/check_links.py

      - name: Install Tauri CLI
        run: cargo install tauri-cli --locked --version 2.12.3

      - name: Record Tauri CLI version
        run: |
          cargo tauri --version | Tee-Object -FilePath tauri-cli-version.txt
          Get-Content tauri-cli-version.txt

      - name: Build NSIS bundle
        working-directory: crates/rwp-ui-native/src-tauri
        run: cargo tauri build --bundles nsis

      # NOTE: `cargo tauri build` resolves the target dir through the Cargo
      # workspace, so the bundle lands in the workspace-root `target/`, NOT
      # in `crates/rwp-ui-native/src-tauri/target/` (run #2 failed here).
      # NOTE: the NSIS bundle file carries spaces
      # (e.g. `RidTheWann Performance_0.4.0_x64-setup.exe`) while the published
      # GitHub asset uses dots, so rename first: the SHA256SUMS entry must
      # match the uploaded asset name exactly or `sha256sum -c` fails.
      - name: SHA256SUMS
        run: |
          $bundle = "target/release/bundle/nsis"
          $exes = Get-ChildItem -LiteralPath $bundle -Filter "*setup.exe"
          if ($exes.Count -eq 0) { throw "no NSIS setup.exe found in $bundle" }
          foreach ($exe in $exes) {
            $dotted = $exe.Name -replace " ", "."
            if ($dotted -ne $exe.Name) { Rename-Item -LiteralPath $exe.FullName -NewName $dotted }
          }
          $renamed = Get-ChildItem -LiteralPath $bundle -Filter "*setup.exe"
          $lines = foreach ($exe in $renamed) {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $exe.FullName).Hash.ToLower()
            "$hash  $($exe.Name)"
          }
          $lines | Set-Content -Path "$bundle/SHA256SUMS" -Encoding ascii
          Get-Content "$bundle/SHA256SUMS"
          Get-ChildItem -LiteralPath $bundle | Select-Object Name, Length

      # The GitHub Release body carries the CHANGELOG.md section for the
      # pushed tag verbatim, so the published notes never drift from the
      # tree. Derives the section from the tag name (vX.Y.Z-alpha ->
      # ## [X.Y.Z-alpha]); manual dispatch runs keep a placeholder so the
      # dry-run stays green without publishing.
      - name: Extract release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = $env:RELEASE_TAG.TrimStart("v")
          $notes = Get-Content -LiteralPath CHANGELOG.md -Encoding utf8
          $start = -1
          $end = $notes.Count
          for ($i = 0; $i -lt $notes.Count; $i++) {
            if ($start -lt 0 -and $notes[$i].StartsWith("## [$version]")) { $start = $i }
            elseif ($start -ge 0 -and $notes[$i] -match '^## ') { $end = $i; break }
          }
          if ($start -lt 0) {
            "# Dry-run notes (no CHANGELOG section for [$version] on this ref)." | Set-Content -Path release-body.md -Encoding utf8
          } else {
            $notes[$start..($end - 1)] | Set-Content -Path release-body.md -Encoding utf8
          }
          Get-Content -LiteralPath release-body.md

      - name: Publish GitHub pre-release
        # Tag-only: workflow_dispatch dry-runs stop before publishing.
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          prerelease: true
          generate_release_notes: false
          body_path: release-body.md
          files: |
            target/release/bundle/nsis/*setup.exe
            target/release/bundle/nsis/SHA256SUMS
            tauri-cli-version.txt
