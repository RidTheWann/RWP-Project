# CI — gates + debug build (Windows-only).
#
# Supplement, not replacement: the binding verification authority stays the
# pinned local gate in `docs/local-gates.md` (toolchain 1.99.0, `--locked`).
# CI mirrors that gate order so a red `main` is caught even when a batch
# forgets the local run. Release bundling lives in `release-alpha.yml`
# (tag publishes; manual dispatch dry-runs without publishing) to keep
# per-push cycles short.
#
# No Node.js: the frontend is vanilla HTML/CSS/JS (`crates/rwp-ui-native/web`),
# so there is nothing to `npm install`. No `tauri-action`: the project ships
# with auto-update OFF (ADR-0030) and `tauri-action` defaults to uploading an
# updater JSON — the release workflow builds via `cargo tauri` directly.

name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: Gates (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Provenance only (no branch policy): maps trigger refs through `env:`
      # so no script interpolates github.head_ref/base_ref/ref_name directly,
      # per tools/check_workflow_security.py.
      - name: Record trigger refs
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          printf 'head_ref=%s base_ref=%s ref_name=%s\n' "$HEAD_REF" "$BASE_REF" "$REF_NAME"

      - name: Install Rust 1.99.0
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: fmt
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Tests
        run: cargo test --workspace --all-features --locked

      - name: Install gate tools
        shell: bash
        run: |
          set -euo pipefail
          cargo install cargo-deny --locked --version 0.20.2
          cargo install cargo-audit --locked --version 0.22.2

      - name: cargo-deny
        run: cargo deny check

      - name: cargo-audit
        run: cargo audit

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - name: Workflow security
        run: python tools/check_workflow_security.py

      - name: Schemas, docs, links
        shell: bash
        run: |
          set -euo pipefail
          pip install jsonschema
          python tools/validate_schemas.py
          python tools/check_docs.py
          python -m unittest discover -s tools
          python tools/check_links.py

  build:
    name: Build (Windows debug)
    needs: gates
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust 1.99.0
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: cargo build
        run: cargo build --locked --workspace
