[workspace]
members = [
    "crates/rwp-core",
    "crates/rwp-capture",
    "crates/rwp-system",
    "crates/rwp-analysis",
    "crates/rwp-diagnostics",
    "crates/rwp-report",
    "crates/rwp-session",
    "crates/rwp-cli",
    "crates/rwp-ui",
    "crates/rwp-ui-native/src-tauri",
]
# `fuzz/` is a self-contained cargo-fuzz workspace kept out of the stable
# 1.99 workspace so its nightly/libFuzzer dependencies never enter a gate.
exclude = ["fuzz"]
resolver = "3"

[workspace.package]
version = "0.1.0"
description = "Evidence-based gaming and streaming performance analyzer for Windows 11"
edition = "2024"
rust-version = "1.91.0"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
criterion = "0.8.2"
insta = "1.49.0"
proptest = "1.11.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["registry"] }
nvml-wrapper = "0.13.0"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Performance", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_System_Console", "Win32_System_JobObjects", "Win32_System_Diagnostics_ToolHelp", "Win32_Security_WinTrust", "Win32_Security_Cryptography", "Win32_UI_WindowsAndMessaging"] }

[workspace.lints.rust]
missing_docs = "warn"
non_ascii_idents = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
unsafe_code = "warn"
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
expect_used = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
undocumented_unsafe_blocks = "deny"
