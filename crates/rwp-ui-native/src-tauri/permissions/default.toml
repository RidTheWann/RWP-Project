"$schema" = "../gen/schemas/schema.json"

[[permission]]
identifier = "session-commands"
description = "Allows the main window to invoke exactly the session commands the webview calls (least privilege; uninvoked backend commands stay registered but ungranted)."
commands.allow = [
  "session_stop",
  "session_status",
  "session_history",
  "session_history_load",
  "session_compare",
  "session_processes",
  "session_pick_presentmon_file",
    "session_start_managed",
    "session_preflight",
    "session_error_kind",
    "session_close_confirmed",
]
