"$schema" = "../gen/schemas/schema.json"

[[permission]]
identifier = "session-commands"
description = "Allows the main window to invoke only the registered session application commands."
commands.allow = [
  "session_start",
  "session_stop",
  "session_status",
  "session_reset",
  "session_history",
  "session_history_load",
  "session_compare",
  "session_processes",
  "session_pick_presentmon_file",
  "session_pick_output_file",
  "session_error_remediation",
]
